<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Drive | Premium Cloud Storage</title>
    <!-- Importing modern typography from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Hand-picked premium color palette for a sleek 'Dark Mode' aesthetic */
            --bg-color: #0f172a;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            /* --- Dynamic Gradient Background ---
               HOW: We layer three radial gradients at different corners.
               WHY: This gives the UI depth and a "nebula" feel typical of premium SaaS products.
            */
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Components --- */

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            outline: none;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* --- Glassmorphism Card Style ---
           HOW: 
           1. 'backdrop-filter: blur' creates the frosted glass look.
           2. 'rgba(...)' background provides the translucent tint.
           3. '1px solid rgba(...)' border defines the sharp edge.
           WHY: This creates a multi-layered, state-of-the-art UI feel.
        */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* --- Auth Section --- */

        #auth-section {
            max-width: 450px;
            margin: 4rem auto;
            display: none;
        }

        .auth-toggle {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .auth-toggle span {
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .auth-toggle span.active {
            color: var(--text-primary);
            position: relative;
        }

        .auth-toggle span.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent-color);
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        /* --- Dashboard --- */

        #dashboard {
            display: none;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .upload-zone {
            border: 2px dashed var(--glass-border);
            padding: 2rem;
            text-align: center;
            border-radius: 18px;
            transition: all 0.3s;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
        }

        .upload-zone:hover {
            border-color: var(--accent-color);
            background: rgba(99, 102, 241, 0.05);
        }

        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .post-card {
            overflow: hidden;
            transition: transform 0.3s;
        }

        .post-card:hover {
            transform: translateY(-10px);
        }

        .post-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 14px;
            background: #1e293b;
        }

        .post-info {
            padding-top: 1.5rem;
        }

        .post-caption {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .post-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            color: var(--error);
            font-weight: 700;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .post-card:hover .delete-btn {
            opacity: 1;
        }

        .status-msg {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 2rem;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            transform: translateY(200%);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .status-msg.show {
            transform: translateY(0);
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Main Header -->
        <header>
            <div class="logo">AURA DRIVE</div>
            <div id="header-actions">
                <!-- Sign Out button injected here via JS -->
            </div>
        </header>

        <!-- Notification Snackbar -->
        <div id="notification" class="status-msg"></div>

        <!-- AUTH PORTAL: Login and Registration tabs -->
        <div id="auth-section" class="glass-card animate-fade-in">
            <div class="auth-toggle">
                <span id="tab-login" class="active" onclick="toggleAuth('login')">Login</span>
                <span id="tab-register" onclick="toggleAuth('register')">Register</span>
            </div>

            <form id="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Continue</button>
            </form>
        </div>

        <!-- DASHBOARD: File upload and recent assets feed -->
        <div id="dashboard" class="animate-fade-in">
            <div class="upload-section glass-card">
                <div>
                    <h2 style="margin-bottom: 0.5rem;">New Upload</h2>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">Store your memories on Aura Drive securely.</p>
                </div>
                <div style="display: flex; gap: 1.5rem; align-items: flex-start;">
                    <!-- Dropzone style file input -->
                    <div class="upload-zone" onclick="document.getElementById('file-input').click()">
                        <div id="upload-label">📁 Click to Select File</div>
                        <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(this)">
                    </div>
                    <div style="flex-grow: 1;">
                        <input type="text" id="caption-input" class="form-group"
                            style="width: 100%; padding: 1rem; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 12px; color: white;"
                            placeholder="Add a caption...">
                        <button class="btn btn-primary" onclick="uploadFile()"
                            style="margin-top: 1rem; width: 100%;">Upload to Aura</button>
                    </div>
                </div>
            </div>

            <div class="feed-header" style="margin-bottom: 2rem;">
                <h2>Recent Assets</h2>
            </div>
            <!-- Grid container for assets -->
            <div id="feed" class="feed-grid">
                <!-- Post cards injected here via JS -->
            </div>
        </div>
    </div>

    <script>
        /**
         * Frontend Logic for Aura Drive.
         * 
         * HOW IT WORKS:
         * 1. **SPA (Single Page App)**: We use 'display: block/none' to switch between Auth and Dashboard views.
         *    WHY: This feels faster than reloading the page and keeps the application state in memory.
         * 2. **JWT Persistence**: We save the access token in 'localStorage'.
         *    WHY: This allows you to stay logged in even if you refresh the browser.
         */
        const API_BASE = '/auth';
        const APP_BASE = '';
        let currentAuthMode = 'login';
        let currentUser = null;

        // Initialization: Check if the user is already logged in
        window.onload = () => {
            const token = localStorage.getItem('aura_token');
            if (token) {
                checkAuth(token);
            } else {
                showAuth();
            }
        };

        /** Displays a success or error message at the bottom of the screen. */
        function showNotification(msg, type = 'success') {
            const el = document.getElementById('notification');
            el.textContent = msg;
            el.style.backgroundColor = type === 'success' ? 'var(--success)' : 'var(--error)';
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        /** Switches the form between 'Login' and 'Register' modes. */
        function toggleAuth(mode) {
            currentAuthMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
        }

        /** Verifies the token by attempting to load the protected feed. */
        async function checkAuth(token) {
            try {
                loadFeed();
                showDashboard();
            } catch (e) {
                localStorage.removeItem('aura_token');
                showAuth();
            }
        }

        /** Handles Login and Registration via AJAX. */
        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (currentAuthMode === 'login') {
                    // Step: Collect Login Credentials
                    const formData = new FormData();
                    formData.append('username', email);
                    formData.append('password', password);

                    const res = await fetch('/auth/jwt/login', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await res.json();
                    if (res.ok) {
                        // Store the token for future requests
                        localStorage.setItem('aura_token', data.access_token);
                        showNotification('Welcome back!');
                        showDashboard();
                        loadFeed();
                    } else {
                        throw new Error(data.detail || 'Login failed');
                    }
                } else {
                    // Registration Request (JSON format)
                    const res = await fetch('/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    if (res.ok) {
                        showNotification('Account created! Please login.');
                        toggleAuth('login');
                    } else {
                        const data = await res.json();
                        throw new Error(data.detail || 'Registration failed');
                    }
                }
            } catch (err) {
                showNotification(err.message, 'error');
            }
        };

        /** Swaps visibility to show the Auth card. */
        function showAuth() {
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('header-actions').innerHTML = '';
        }

        /** Swaps visibility to show the Dashboard. */
        function showDashboard() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('header-actions').innerHTML = `
                <button class="btn" style="color: var(--text-secondary)" onclick="logout()">Sign Out</button>
            `;
        }

        /** Logs out by deleting the browser's token. */
        function logout() {
            localStorage.removeItem('aura_token');
            showAuth();
        }

        /** UX: Shows the file name once selected. */
        function handleFileSelect(input) {
            const label = document.getElementById('upload-label');
            if (input.files.length > 0) {
                label.textContent = `📄 ${input.files[0].name}`;
            }
        }

        /** Handles multi-part file uploads (File + Data). */
        async function uploadFile() {
            const fileInput = document.getElementById('file-input');
            const captionInput = document.getElementById('caption-input');
            const token = localStorage.getItem('aura_token');

            if (fileInput.files.length === 0) {
                showNotification('Please select a file', 'error');
                return;
            }

            // HOW: We use 'FormData' because it allows sending binary files over HTTP.
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('caption', captionInput.value);

            try {
                showNotification('Uploading...');
                const res = await fetch('/uploadfile', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (res.ok) {
                    showNotification('Success! File stored.');
                    fileInput.value = '';
                    captionInput.value = '';
                    document.getElementById('upload-label').textContent = '📁 Click to Select File';
                    loadFeed(); 
                } else {
                    const data = await res.json();
                    throw new Error(data.detail || 'Upload failed');
                }
            } catch (err) {
                showNotification(err.message, 'error');
            }
        }

        /** Fetches our custom asset list from the FastAPI /feed route. */
        async function loadFeed() {
            const token = localStorage.getItem('aura_token');
            try {
                const res = await fetch('/feed', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                renderFeed(data.posts || []);
            } catch (err) {
                console.error('Feed error:', err);
            }
        }

        /** Generates HTML cards for each asset in the DB. */
        function renderFeed(posts) {
            const container = document.getElementById('feed');
            container.innerHTML = posts.length === 0 ? '<p style="color: var(--text-secondary)">No assets found.</p>' : '';

            posts.forEach(post => {
                const isImage = post.file_type && post.file_type.startsWith('image');
                const thumb = isImage ? post.url : 'https://placehold.co/600x400/1e293b/f8fafc?text=Document';

                const card = document.createElement('div');
                card.className = 'post-card glass-card animate-fade-in';
                card.innerHTML = `
                    <img src="${thumb}" class="post-image" alt="Post content" onerror="this.src='https://placehold.co/600x400/1e293b/f8fafc?text=Aura+Asset'">
                    <div class="post-info">
                        <div class="post-caption">${post.caption || 'Untitled Asset'}</div>
                        <div class="post-meta">
                            <span>${new Date(post.created_at).toLocaleDateString()}</span>
                            <span class="delete-btn" onclick="deletePost('${post.id}')">DELETE</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        /** AJAX deletion request. */
        async function deletePost(id) {
            if (!confirm('Permanently delete this asset?')) return;

            const token = localStorage.getItem('aura_token');
            try {
                const res = await fetch(`/posts/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    showNotification('Asset removed successfully.');
                    loadFeed(); 
                } else {
                    const data = await res.json();
                    let errorMsg = 'Delete failed';
                    if (data.detail) {
                        errorMsg = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
                    }
                    showNotification(errorMsg, 'error');
                }
            } catch (err) {
                showNotification('Connection error or invalid ID', 'error');
            }
        }
    </script>
</body>

</html>
